[workspace]
members = [
    "crates/*"
]

resolver = "2"

[workspace.package]
version = "0.0.2-alpha.1"
authors = ["Benedikt Schwab <benedikt.schwab@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/envis-space/egraphics"

[workspace.dependencies]
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
gltf = "1.4.1"
gltf-json = "1.4.1"
glam = "0.34.1"
approx = "0.5.1"
serde = "1.0"
serde_json = "1.0.154"
chrono = "0.4.45"
tar = "0.4.46"
zstd = "0.14.3"
ruzstd = "0.9.1"
strum = "0.28.0"
strum_macros = "0.28.0"
slotmap = "1.1.1"
bytemuck = "1.25.2"

